<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/base :: body(
        emailTitle=#{email.passwordChanged.title},
        templateContent=~{::content})}">
<body>
    <th:block th:fragment="content">
        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Bonjour <strong style="color: #1a73e8;" th:text="${firstName}">Prénom</strong>,
        </p>

        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Votre mot de passe Collabix a été modifié avec succès.
        </p>

        <p style="color: #666666; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Si vous n'êtes pas à l'origine de cette modification, veuillez contacter
            immédiatement notre équipe support et réinitialiser votre mot de passe.
        </p>

        <th:block th:include="~{emails/shared/divider :: divider}" />

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
                <td style="padding: 5px 0;">
                    <p style="color: #999999; font-size: 13px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                        <strong>Date :</strong> <span th:text="${#temporals.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}">01/01/2025 12:00</span>
                    </p>
                </td>
            </tr>
            <tr>
                <td style="padding: 5px 0;">
                    <p style="color: #999999; font-size: 13px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                        <strong>Adresse IP :</strong> <span th:text="${ipAddress}">192.168.1.1</span>
                    </p>
                </td>
            </tr>
        </table>
    </th:block>
</body>
</html>
