<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/base :: body(
        emailTitle=#{email.mention.title},
        templateContent=~{::content})}">
<body>
    <th:block th:fragment="content">
        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Bonjour <strong style="color: #1a73e8;" th:text="${firstName}">Prénom</strong>,
        </p>

        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            <strong th:text="${mentionedByName}">Collègue</strong> vous a mentionné dans
            <span th:text="${workspaceName}">Mon Espace</span>.
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f8f9fa; border-radius: 6px; border-left: 4px solid #1a73e8; margin: 20px 0;">
            <tr>
                <td style="padding: 15px 20px;">
                    <p style="color: #333333; font-size: 14px; line-height: 1.6; margin: 0; font-family: Arial, Helvetica, sans-serif;" th:text="${notificationMessage}">
                        Contenu de la mention...
                    </p>
                    <p style="color: #999999; font-size: 12px; line-height: 1.5; margin: 10px 0 0 0; font-family: Arial, Helvetica, sans-serif;">
                        <span th:text="${projectName}">Projet</span> &middot;
                        <span th:text="${departmentName}">Département</span>
                    </p>
                </td>
            </tr>
        </table>

        <th:block th:if="${actionLink}" th:include="~{emails/shared/button :: button(
            link=${actionLink},
            label=#{email.mention.action})}" />
    </th:block>
</body>
</html>
