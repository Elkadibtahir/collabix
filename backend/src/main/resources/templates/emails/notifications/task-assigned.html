<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/base :: body(
        emailTitle=#{email.taskAssigned.title},
        templateContent=~{::content})}">
<body>
    <th:block th:fragment="content">
        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Bonjour <strong style="color: #1a73e8;" th:text="${firstName}">Prénom</strong>,
        </p>

        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Une nouvelle tâche vous a été assignée dans
            <strong th:text="${projectName}">Projet</strong>.
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f8f9fa; border-radius: 6px; margin: 20px 0;">
            <tr>
                <td style="padding: 15px 20px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                        <tr>
                            <td style="padding: 5px 0;">
                                <p style="color: #333333; font-size: 16px; font-weight: 600; margin: 0; font-family: Arial, Helvetica, sans-serif;" th:text="${taskName}">
                                    Nom de la tâche
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0;">
                                <p style="color: #666666; font-size: 14px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                                    <strong>Projet :</strong> <span th:text="${projectName}">Projet</span>
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0;">
                                <p style="color: #666666; font-size: 14px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                                    <strong>Assigné par :</strong> <span th:text="${assignedByName}">Collègue</span>
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0;">
                                <p style="color: #666666; font-size: 14px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                                    <strong>Échéance :</strong> <span th:text="${dueDate}">31/12/2025</span>
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0;">
                                <p style="color: #666666; font-size: 14px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                                    <strong>Priorité :</strong>
                                    <span style="color: #ea4335; font-weight: 600;" th:text="${priority}">Haute</span>
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <th:block th:include="~{emails/shared/button :: button(
            link=${actionLink},
            label=#{email.taskAssigned.action})}" />

        <p style="color: #666666; font-size: 14px; line-height: 1.5; margin: 20px 0 0 0; font-family: Arial, Helvetica, sans-serif;" th:if="${notificationMessage}" th:text="${notificationMessage}">
            Message optionnel...
        </p>
    </th:block>
</body>
</html>
