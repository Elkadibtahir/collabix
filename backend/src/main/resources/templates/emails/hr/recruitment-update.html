<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/base :: body(
        emailTitle=#{email.recruitmentUpdate.title},
        templateContent=~{::content})}">
<body>
    <th:block th:fragment="content">
        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Bonjour <strong style="color: #1a73e8;" th:text="${firstName}">Prénom</strong>,
        </p>

        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;">
            Votre candidature pour le poste de <strong th:text="${position}">Développeur</strong>
            a été mise à jour.
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f8f9fa; border-radius: 6px; margin: 20px 0;">
            <tr>
                <td style="padding: 15px 20px;">
                    <p style="color: #333333; font-size: 14px; line-height: 1.5; margin: 0; font-family: Arial, Helvetica, sans-serif;">
                        <strong>Nouveau statut :</strong>
                        <span style="color: #1a73e8; font-weight: 600;" th:text="${recruitmentStatus}">En cours d'examen</span>
                    </p>
                </td>
            </tr>
        </table>

        <p style="color: #333333; font-size: 16px; line-height: 1.6; margin: 0 0 20px 0; font-family: Arial, Helvetica, sans-serif;" th:text="${notificationMessage}">
            Détails de la mise à jour...
        </p>

        <th:block th:if="${actionLink}" th:include="~{emails/shared/button :: button(
            link=${actionLink},
            label=#{email.recruitmentUpdate.action})}" />
    </th:block>
</body>
</html>
